name: Release Integrity

on:
    push:
        tags:
            - "v*"
    release:
        types:
            - published
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-integrity-${{ github.ref }}
    cancel-in-progress: false

jobs:
    integrity:
        name: Production tag integrity
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - name: Resolve release tag
              id: release
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  EVENT_TAG: ${{ github.event.release.tag_name }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  if [[ "$EVENT_NAME" == "release" ]]; then
                    echo "tag=$EVENT_TAG" >> "$GITHUB_OUTPUT"
                  else
                    echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout tagged source
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.release.outputs.tag }}
                  fetch-depth: 0
                  submodules: recursive

            - name: Setup Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.7.1

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Verify immutable production reference
              shell: bash
              env:
                  TAG: ${{ steps.release.outputs.tag }}
              run: |
                  version=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
                  test "$TAG" = "v$version"
                  test "$(git cat-file -t "$TAG")" = "tag"
                  tagged_sha=$(git rev-list -n 1 "$TAG")
                  production_sha=$(git rev-parse origin/production)
                  test "$tagged_sha" = "$production_sha"
                  test "$tagged_sha" = "$(git rev-parse HEAD)"

            - name: Re-run quality gate
              run: bash scripts/ci.sh
