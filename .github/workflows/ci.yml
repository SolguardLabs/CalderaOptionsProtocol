name: CI

on:
    push:
        branches:
            - main
            - production
            - "agent/**"
        tags:
            - "v*"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Quality / ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Setup Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.7.1

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Validate project on Linux
              if: runner.os == 'Linux'
              run: bash scripts/ci.sh

            - name: Validate project on Windows
              if: runner.os == 'Windows'
              shell: pwsh
              run: ./scripts/ci.ps1
